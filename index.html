<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RTJ Prompter</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#04121f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RTJ Prompter">
<style>
  :root { --gold:#c9a227; --ink:#f5f5f0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif; overflow: hidden; }

  /* ---------- header banner + control bar ---------- */
  #topwrap { position: fixed; top: 0; left: 0; right: 0; z-index: 40; transition: opacity .3s; }
  #topwrap.fade { opacity: 0; pointer-events: none; }
  #banner { display: block; width: 100%; height: 200px; object-fit: cover; object-position: center bottom; }
  #bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 10px 12px; background: #101012; border-bottom: 2px solid var(--gold);
    font-family: Arial, Helvetica, sans-serif; }
  #bar button { background: #1c1c1f; color: var(--ink); border: 1px solid #3a3a3e;
    border-radius: 8px; padding: 10px 16px; font-size: 16px; cursor: pointer; min-height: 44px; }
  #bar button:hover { border-color: var(--gold); }
  #bar button.on { background: var(--gold); color: #000; font-weight: 700; }
  #bar label { font-size: 13px; color: #bbb; display: flex; align-items: center; gap: 6px; }
  #bar input[type=range] { width: 130px; accent-color: var(--gold); }
  #bar .val { color: var(--gold); font-size: 13px; min-width: 34px; }
  #playBtn { background: var(--gold); color: #000; font-weight: 700; min-width: 120px; }
  #bar .spacer { flex: 1; }

  /* ---------- edit view ---------- */
  #editView { position: fixed; inset: 0; z-index: 60; background: #0a0a0b;
    display: none; flex-direction: column; padding: 24px 20px 20px; }
  #editView.open { display: flex; }
  #editView h2 { font-family: Arial, sans-serif; font-size: 18px; color: var(--gold); margin-bottom: 10px; }
  #scriptBox { flex: 1; width: 100%; background: #141416; color: var(--ink);
    border: 1px solid #333; border-radius: 10px; padding: 16px;
    font-family: Georgia, serif; font-size: 20px; line-height: 1.5; resize: none; }
  #editView .row { display: flex; gap: 8px; margin-top: 12px; font-family: Arial, sans-serif; }
  #editView button { background: var(--gold); color: #000; font-weight: 700; border: 0;
    border-radius: 8px; padding: 12px 20px; font-size: 16px; cursor: pointer; min-height: 48px; }
  #editView button.ghost { background: #1c1c1f; color: var(--ink); border: 1px solid #3a3a3e; }

  /* ---------- prompt stage ---------- */
  #stage { position: fixed; inset: 0; overflow: hidden; }
  #scroller { position: absolute; left: 0; right: 0; top: 0; will-change: transform; }
  #text { max-width: 78%; margin: 0 auto; padding: 45vh 0 60vh;
    font-size: 64px; line-height: 1.45; text-align: center; white-space: pre-wrap; }
  #text.mirror { transform: scaleX(-1); }
  /* reading marker */
  #marker { position: fixed; left: 0; right: 0; top: 38%; height: 0; z-index: 10; pointer-events: none; }
  #marker::before, #marker::after { content: ''; position: absolute; top: -14px;
    border-top: 14px solid transparent; border-bottom: 14px solid transparent; }
  #marker::before { left: 6px; border-left: 22px solid var(--gold); }
  #marker::after { right: 6px; border-right: 22px solid var(--gold); }
  #marker .line { position: absolute; left: 40px; right: 40px; top: 0;
    border-top: 1px solid rgba(201,162,39,.35); }
  /* countdown */
  #count { position: fixed; inset: 0; z-index: 50; display: none;
    align-items: center; justify-content: center;
    font-size: 220px; font-weight: 700; color: var(--gold);
    background: rgba(0,0,0,.55); font-family: Arial, sans-serif; }
  #hint { position: fixed; bottom: 10px; left: 0; right: 0; z-index: 20; text-align: center;
    font-family: Arial, sans-serif; font-size: 13px; color: #777; pointer-events: none; }

  /* ---------- record mode ---------- */
  #cam { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
  #cam.front { transform: scaleX(-1); }
  body.recmode #cam { display: block; }
  body.recmode #text { text-shadow: 0 2px 14px rgba(0,0,0,.92), 0 0 6px rgba(0,0,0,.92); }
  body.recmode #hint { display: none; }
  #recbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; display: none;
    justify-content: center; align-items: center; gap: 14px; padding: 14px;
    background: rgba(10,10,12,.72); font-family: Arial, sans-serif; }
  body.recmode #recbar { display: flex; }
  #recbar button { border-radius: 999px; border: 1px solid #3a3a3e; background: #1c1c1f; color: var(--ink);
    padding: 12px 22px; font-size: 17px; cursor: pointer; min-height: 52px; }
  #recBtn { background: #b3001b; border-color: #ff3355; font-weight: 700; min-width: 170px; }
  #recBtn.recording { background: #1c1c1f; color: #ff5b74; }
  #recTime { color: #ff5b74; font-size: 18px; min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; }
  #recDot { width: 12px; height: 12px; border-radius: 50%; background: #ff3355; display: none; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .15; } }
  #camMsg { position: fixed; left: 0; right: 0; bottom: 96px; z-index: 46; text-align: center;
    color: #ffb3c0; font-family: Arial, sans-serif; font-size: 15px; display: none; padding: 0 16px; }
  #takeView { position: fixed; inset: 0; z-index: 60; background: #0a0a0b; display: none;
    flex-direction: column; padding: 24px 20px; font-family: Arial, sans-serif; }
  #takeView.open { display: flex; }
  #takeView h2 { color: var(--gold); font-size: 18px; margin-bottom: 12px; }
  #takeVideo { flex: 1; width: 100%; min-height: 0; background: #000; border-radius: 10px; }
  #takeView .row { display: flex; gap: 8px; margin-top: 12px; }
  #takeView a, #takeView button { border-radius: 8px; padding: 12px 20px; font-size: 16px; min-height: 48px;
    cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
  #dlBtn { background: var(--gold); color: #000; font-weight: 700; }
  #discardBtn { background: #1c1c1f; color: var(--ink); border: 1px solid #3a3a3e; }
</style>
</head>

<div id="bar">
  <button id="playBtn">▶ Play</button>
  <button id="restartBtn" title="Back to the top">⏮ Top</button>
  <label>Speed <input type="range" id="speed" min="10" max="300" value="90"><span class="val" id="speedVal">90</span></label>
  <label>Text size <input type="range" id="fsize" min="32" max="120" value="64"><span class="val" id="fsizeVal">64</span></label>
  <button id="mirrorBtn" title="Mirror the text for a through-the-glass prompter">🪞 Mirror</button>
  <button id="camBtn" title="Prompt over the camera and record the take">🎥 Record mode</button>
  <button id="editBtn">✎ Edit script</button>
  <span class="spacer"></span>
  <button id="fsBtn" title="Full screen">⛶ Full screen</button>
</div>
</div>

<div id="stage">
  <video id="cam" autoplay playsinline muted></video>
  <div id="scroller"><div id="text"></div></div>
  <div id="marker"><div class="line"></div></div>
</div>
<div id="recbar">
  <span id="recDot"></span>
  <button id="recPlayBtn" title="Roll or pause the words">▶ Words</button>
  <button id="recBtn">● Record</button>
  <span id="recTime">0:00</span>
  <button id="flipBtn" title="Front / back camera">⇄ Camera</button>
</div>
<div id="camMsg"></div>
<div id="takeView">
  <h2>Your take</h2>
  <video id="takeVideo" controls playsinline></video>
  <div class="row">
    <a id="dlBtn" href="#" download="rtj-take.webm">⬇ Save the video</a>
    <button id="discardBtn">Discard &amp; back</button>
  </div>
</div>
<div id="count"></div>
<div id="hint">Space = play / pause &nbsp;·&nbsp; ↑ ↓ = speed &nbsp;·&nbsp; ← → = nudge &nbsp;·&nbsp; move the mouse to the top for controls</div>

<div id="editView">
  <h2>Your script</h2>
  <textarea id="scriptBox"></textarea>
  <div class="row">
    <button id="saveScript">Save &amp; prompt</button>
    <button id="cancelEdit" class="ghost">Cancel</button>
  </div>
</div>

<script>
const DEFAULT_SCRIPT = `Students at Ivany Campus are getting hands-on experience with the latest technology as part of their college training.

From digital media to professional production equipment, these resources help prepare graduates for the demands of today's workforce.

I'm Curtis Robitaille, WTV News, Dartmouth.`;

const textEl = document.getElementById('text');
const scroller = document.getElementById('scroller');
const playBtn = document.getElementById('playBtn');
const topwrap = document.getElementById('topwrap');
const countEl = document.getElementById('count');
const speedIn = document.getElementById('speed');
const fsizeIn = document.getElementById('fsize');

let script = localStorage.getItem('prompterScript') || DEFAULT_SCRIPT;
let y = 0, playing = false, speed = +speedIn.value, lastT = null, raf = null;
let mirrored = false;

function render() { textEl.textContent = script; }
function maxScroll() { return Math.max(0, scroller.offsetHeight - window.innerHeight * 0.55); }
function apply() { scroller.style.transform = `translateY(${-y}px)`; }
function clampY() { y = Math.min(Math.max(0, y), maxScroll()); }

function tick(t) {
  if (!playing) return;
  if (lastT == null) lastT = t;
  const dt = (t - lastT) / 1000; lastT = t;
  y += speed * dt;
  if (y >= maxScroll()) { y = maxScroll(); pause(); }
  apply();
  raf = requestAnimationFrame(tick);
}
function play() {
  if (playing) return;
  playing = true; playBtn.textContent = '⏸ Pause'; lastT = null;
  raf = requestAnimationFrame(tick);
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => topwrap.classList.add('fade'), 2500);
}
function pause() {
  playing = false; playBtn.textContent = '▶ Play';
  if (raf) cancelAnimationFrame(raf);
  clearTimeout(hideTimer);
  topwrap.classList.remove('fade');
}
function countdownThenPlay() {
  if (playing) { pause(); return; }
  let n = 3; countEl.style.display = 'flex'; countEl.textContent = n;
  const iv = setInterval(() => {
    n--;
    if (n <= 0) { clearInterval(iv); countEl.style.display = 'none'; play(); }
    else countEl.textContent = n;
  }, 800);
}
function toTop() { pause(); y = 0; apply(); }

playBtn.addEventListener('click', countdownThenPlay);
document.getElementById('restartBtn').addEventListener('click', toTop);
speedIn.addEventListener('input', () => { speed = +speedIn.value; document.getElementById('speedVal').textContent = speed; });
fsizeIn.addEventListener('input', () => { textEl.style.fontSize = fsizeIn.value + 'px'; document.getElementById('fsizeVal').textContent = fsizeIn.value; clampY(); apply(); });
document.getElementById('mirrorBtn').addEventListener('click', (e) => {
  mirrored = !mirrored; textEl.classList.toggle('mirror', mirrored); e.currentTarget.classList.toggle('on', mirrored);
});
document.getElementById('fsBtn').addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen();
});

/* edit view */
const editView = document.getElementById('editView');
const scriptBox = document.getElementById('scriptBox');
document.getElementById('editBtn').addEventListener('click', () => { pause(); scriptBox.value = script; editView.classList.add('open'); });
document.getElementById('cancelEdit').addEventListener('click', () => editView.classList.remove('open'));
document.getElementById('saveScript').addEventListener('click', () => {
  script = scriptBox.value; localStorage.setItem('prompterScript', script);
  render(); toTop(); editView.classList.remove('open');
});

/* keyboard */
document.addEventListener('keydown', (e) => {
  if (editView.classList.contains('open')) return;
  if (e.code === 'Space') { e.preventDefault(); countdownThenPlay(); }
  else if (e.key === 'ArrowUp') { speed = Math.min(300, speed + 10); speedIn.value = speed; document.getElementById('speedVal').textContent = speed; }
  else if (e.key === 'ArrowDown') { speed = Math.max(10, speed - 10); speedIn.value = speed; document.getElementById('speedVal').textContent = speed; }
  else if (e.key === 'ArrowRight') { y += 60; clampY(); apply(); }
  else if (e.key === 'ArrowLeft') { y -= 60; clampY(); apply(); }
  else if (e.key === 'Home') { toTop(); }
});

/* wheel = manual scroll */
document.getElementById('stage').addEventListener('wheel', (e) => { pause(); y += e.deltaY; clampY(); apply(); }, { passive: true });

/* auto-hide control bar while prompting */
let hideTimer = null;
document.addEventListener('mousemove', (e) => {
  topwrap.classList.remove('fade');
  clearTimeout(hideTimer);
  if (e.clientY > 300) hideTimer = setTimeout(() => { if (playing) topwrap.classList.add('fade'); }, 2500);
});

window.addEventListener('resize', () => { clampY(); apply(); });

/* ---------- record mode ---------- */
const camBtn = document.getElementById('camBtn');
const cam = document.getElementById('cam');
const camMsg = document.getElementById('camMsg');
const recBtn = document.getElementById('recBtn');
const recDot = document.getElementById('recDot');
const recTime = document.getElementById('recTime');
const takeView = document.getElementById('takeView');
const takeVideo = document.getElementById('takeVideo');
const dlBtn = document.getElementById('dlBtn');
let stream = null, recorder = null, chunks = [], recStart = 0, recTimer = null;
let facing = 'user', recMode = false;

function fmtTime(ms) { const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }

async function startCam() {
  try {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing }, audio: true });
    cam.srcObject = stream;
    cam.classList.toggle('front', facing === 'user');
    camMsg.style.display = 'none';
    return true;
  } catch (e) {
    camMsg.textContent = 'The camera could not be opened here. Prompt mode still works — some browsers block camera recording.';
    camMsg.style.display = 'block';
    return false;
  }
}

async function toggleRecMode() {
  if (!recMode) {
    if (!navigator.mediaDevices || !window.MediaRecorder) {
      camMsg.textContent = 'This browser cannot record video. Prompt mode still works.';
      camMsg.style.display = 'block';
      return;
    }
    recMode = true;
    document.body.classList.add('recmode');
    camBtn.classList.add('on'); camBtn.textContent = '🎥 Record mode: on';
    await startCam();
  } else {
    recMode = false;
    document.body.classList.remove('recmode');
    camBtn.classList.remove('on'); camBtn.textContent = '🎥 Record mode';
    if (recorder && recorder.state === 'recording') stopRecording();
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    pause();
  }
}
camBtn.addEventListener('click', toggleRecMode);

document.getElementById('flipBtn').addEventListener('click', async () => {
  facing = (facing === 'user') ? 'environment' : 'user';
  if (recMode) await startCam();
});
document.getElementById('recPlayBtn').addEventListener('click', countdownThenPlay);

function pickMime() {
  const opts = ['video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
  for (const o of opts) { try { if (MediaRecorder.isTypeSupported(o)) return o; } catch (e) {} }
  return '';
}

function beginTake() {
  const mime = pickMime();
  chunks = [];
  recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  recorder.onstop = showTake;
  recorder.start(250);
  recStart = Date.now();
  recTime.textContent = '0:00';
  recTimer = setInterval(() => { recTime.textContent = fmtTime(Date.now() - recStart); }, 250);
  recBtn.textContent = '■ Stop'; recBtn.classList.add('recording'); recDot.style.display = 'block';
  toTop(); play();
}

function stopRecording() {
  if (recorder && recorder.state === 'recording') recorder.stop();
  clearInterval(recTimer);
  recBtn.textContent = '● Record'; recBtn.classList.remove('recording'); recDot.style.display = 'none';
  pause();
}

recBtn.addEventListener('click', async () => {
  if (recorder && recorder.state === 'recording') { stopRecording(); return; }
  if (!stream) { const ok = await startCam(); if (!ok) return; }
  if (playing) pause();
  let n = 3; countEl.style.display = 'flex'; countEl.textContent = n;
  const iv = setInterval(() => {
    n--;
    if (n <= 0) { clearInterval(iv); countEl.style.display = 'none'; beginTake(); }
    else countEl.textContent = n;
  }, 800);
});

function showTake() {
  const type = (recorder && recorder.mimeType) || 'video/webm';
  const blob = new Blob(chunks, { type: type });
  const url = URL.createObjectURL(blob);
  takeVideo.src = url;
  dlBtn.href = url;
  dlBtn.download = 'rtj-take.' + (type.indexOf('mp4') >= 0 ? 'mp4' : 'webm');
  takeView.classList.add('open');
}
document.getElementById('discardBtn').addEventListener('click', () => {
  takeView.classList.remove('open');
  takeVideo.removeAttribute('src'); takeVideo.load();
});

render(); apply();
</script>
</body>
</html>
