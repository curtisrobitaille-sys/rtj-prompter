<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RTJ Prompter</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#04121f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RTJ Prompter">
<style>
  :root { --gold:#c9a227; --ink:#f5f5f0; --mark: 55vh; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif; overflow: hidden; }

  /* ---------- header banner + control bar ---------- */
  #topwrap { position: fixed; top: 0; left: 0; right: 0; z-index: 40; transition: opacity .3s; }
  #topwrap.fade { opacity: 0; pointer-events: none; }
  #banner { background: radial-gradient(120% 170% at 50% 0%, #0e3242 0%, #071a29 55%, #04121f 100%); text-align: center; padding: 10px 0 0; overflow: hidden; }
  #banner .b1 { font-family: 'Arial Black', Arial, sans-serif; font-weight: 900; font-style: italic; font-size: 48px; line-height: 1.1; letter-spacing: 1px; white-space: nowrap; background: linear-gradient(90deg, #c9962e 0%, #f3d27a 24%, #a8ddd6 48%, #35b6ac 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #banner .b2 { font-family: Arial, sans-serif; font-weight: 700; font-size: 38px; line-height: 1.2; letter-spacing: 3px; color: #bfe3de; white-space: nowrap; }
  #banner .b3 { margin-top: 8px; padding: 3px 0 5px; background: linear-gradient(180deg, #e8c877, #c9a24d); color: #14202b; font-family: Arial, sans-serif; font-weight: 700; font-size: 28px; line-height: 1.25; letter-spacing: 2px; white-space: nowrap; }
  @media (max-width: 900px) { #banner .b1 { font-size: 38px; } #banner .b2 { font-size: 27px; letter-spacing: 2px; } #banner .b3 { font-size: 21px; } }
  #bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 10px 12px; background: #101012; border-bottom: 2px solid var(--gold);
    font-family: Arial, Helvetica, sans-serif; }
  #bar button { background: #1c1c1f; color: var(--ink); border: 1px solid #3a3a3e;
    border-radius: 8px; padding: 10px 16px; font-size: 16px; cursor: pointer; min-height: 44px; }
  #bar button:hover { border-color: var(--gold); }
  #bar button.on { background: var(--gold); color: #000; font-weight: 700; }
  #bar label { font-size: 13px; color: #bbb; display: flex; align-items: center; gap: 6px; }
  #bar input[type=range] { width: 130px; accent-color: var(--gold); }
  #bar .val { color: var(--gold); font-size: 13px; min-width: 34px; }
  #playBtn { background: var(--gold); color: #000; font-weight: 700; min-width: 120px; }
  #bar .spacer { flex: 1; }

  /* ---------- edit view ---------- */
  #editView { position: fixed; inset: 0; z-index: 60; background: #0a0a0b;
    display: none; flex-direction: column; padding: 24px 20px 20px; }
  #editView.open { display: flex; }
  #editView h2 { font-family: Arial, sans-serif; font-size: 18px; color: var(--gold); margin-bottom: 10px; }
  #scriptBox { flex: 1; width: 100%; background: #141416; color: var(--ink);
    border: 1px solid #333; border-radius: 10px; padding: 16px;
    font-family: Georgia, serif; font-size: 20px; line-height: 1.5; resize: none; }
  #editView .row { display: flex; gap: 8px; margin-top: 12px; font-family: Arial, sans-serif; }
  #editView button { background: var(--gold); color: #000; font-weight: 700; border: 0;
    border-radius: 8px; padding: 12px 20px; font-size: 16px; cursor: pointer; min-height: 48px; }
  #editView button.ghost { background: #1c1c1f; color: var(--ink); border: 1px solid #3a3a3e; }

  /* script library */
  #libBlock { margin-top: 22px; border-top: 1px solid #2a2a2e; padding-top: 16px; font-family: Arial, sans-serif; overflow-y: auto; }
  #libBlock h2 { font-size: 16px; color: var(--gold); margin-bottom: 10px; }
  .libsave { display: flex; gap: 8px; flex-wrap: wrap; }
  #libName { flex: 1; min-width: 220px; background: #141416; color: var(--ink); border: 1px solid #333;
    border-radius: 8px; padding: 12px; font-size: 16px; }
  #libList { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
  #libList .librow { display: flex; align-items: center; gap: 8px; background: #141416; border: 1px solid #2a2a2e;
    border-radius: 8px; padding: 10px 12px; }
  #libList .nm { flex: 1; font-size: 16px; }
  #libList button { background: #1c1c1f; color: var(--ink); border: 1px solid #3a3a3e; border-radius: 8px;
    padding: 9px 14px; font-size: 14px; cursor: pointer; min-height: 40px; font-weight: 400; }
  #libList button.load { background: var(--gold); color: #000; font-weight: 700; border: 0; }
  .libempty { color: #888; font-size: 14px; }

  /* ---------- prompt stage ---------- */
  #stage { position: fixed; inset: 0; overflow: hidden; }
  #scroller { position: absolute; left: 0; right: 0; top: 0; will-change: transform; }
  #text { max-width: 78%; margin: 0 auto; padding: calc(var(--mark) - .72em) 0 calc(100vh - var(--mark) - .72em);
    font-size: 64px; line-height: 1.45; text-align: center; white-space: pre-wrap; }
  #text.mirror { transform: scaleX(-1); }
  /* reading marker */
  #marker { position: fixed; left: 0; right: 0; top: var(--mark); height: 0; z-index: 10; pointer-events: none; }
  #marker::before, #marker::after { content: ''; position: absolute; top: -14px;
    border-top: 14px solid transparent; border-bottom: 14px solid transparent; }
  #marker::before { left: 6px; border-left: 22px solid var(--gold); }
  #marker::after { right: 6px; border-right: 22px solid var(--gold); }
  #marker .line { position: absolute; left: 40px; right: 40px; top: 0;
    border-top: 1px solid rgba(201,162,39,.35); }
  #marker .grab { position: absolute; left: 0; right: 0; top: -16px; height: 32px; cursor: ns-resize; pointer-events: auto; }
  #marker::before, #marker::after { transition: transform .15s; }
  #marker:hover::before { transform: scale(1.3); }
  #marker:hover::after { transform: scale(1.3); }
  /* RTJ buttons + floating docks (Curtis's design package, Nov 9) */
  .rtj-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 0.95rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
    color: #c9f5ff; background: rgba(8, 28, 36, 0.65); border: 1.5px solid #28c9c7; cursor: pointer;
    user-select: none; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 0 12px rgba(40, 201, 199, 0.35), inset 0 0 10px rgba(40, 201, 199, 0.2);
    transition: all 0.2s ease-in-out; }
  .rtj-btn:hover { background: rgba(14, 45, 58, 0.85); color: #ffffff; border-color: #5efffd;
    box-shadow: 0 0 20px rgba(94, 255, 253, 0.6), inset 0 0 14px rgba(94, 255, 253, 0.25); }
  .rtj-btn.on { border-color: var(--gold); color: var(--gold); box-shadow: 0 0 16px rgba(201,162,77,.45), inset 0 0 10px rgba(201,162,77,.25); }
  .rtj-btn.btn-record { border-color: #c9a24d; color: #f3d27a; box-shadow: 0 0 12px rgba(201,162,77,.4), inset 0 0 10px rgba(201,162,77,.22); }
  .rtj-btn.btn-record:hover { border-color: #f3d27a; color: #ffe9a8; }
  .floating-dock { position: fixed; top: var(--mark); transform: translateY(-50%); display: flex; flex-direction: column; gap: 18px; z-index: 1000; transition: opacity .25s; }
  .dock-left { left: 24px; }
  .dock-right { right: 24px; }
  .floating-dock .rtj-btn { min-width: 150px; padding: 12px 24px; border-radius: 9999px; }
  body.faded .floating-dock { opacity: 0; pointer-events: none; }
  body.faded .floating-dock.near { opacity: 1; pointer-events: auto; }
  body.recmode .floating-dock { display: none; }
  /* countdown */
  #count { position: fixed; inset: 0; z-index: 50; display: none;
    align-items: center; justify-content: center;
    font-size: 220px; font-weight: 700; color: var(--gold);
    background: rgba(0,0,0,.55); font-family: Arial, sans-serif; }
  #hint { position: fixed; bottom: 10px; left: 0; right: 0; z-index: 20; text-align: center;
    font-family: Arial, sans-serif; font-size: 13px; color: #777; pointer-events: none; }

  /* ---------- record mode ---------- */
  #cam { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
  #cam.front { transform: scaleX(-1); }
  body.recmode #cam { display: block; }
  body.recmode #text { text-shadow: 0 2px 14px rgba(0,0,0,.92), 0 0 6px rgba(0,0,0,.92); }
  body.recmode #hint { display: none; }
  #recbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; display: none;
    justify-content: center; align-items: center; gap: 14px; padding: 14px;
    background: rgba(10,10,12,.72); font-family: Arial, sans-serif; }
  body.recmode #recbar { display: flex; }
  #recbar button { border-radius: 999px; border: 1px solid #3a3a3e; background: #1c1c1f; color: var(--ink);
    padding: 12px 22px; font-size: 17px; cursor: pointer; min-height: 52px; }
  #recBtn { background: #b3001b; border-color: #ff3355; font-weight: 700; min-width: 170px; }
  #recBtn.recording { background: #1c1c1f; color: #ff5b74; }
  #recTime { color: #ff5b74; font-size: 18px; min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; }
  #recDot { width: 12px; height: 12px; border-radius: 50%; background: #ff3355; display: none; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .15; } }
  #camMsg { position: fixed; left: 0; right: 0; bottom: 96px; z-index: 46; text-align: center;
    color: #ffb3c0; font-family: Arial, sans-serif; font-size: 15px; display: none; padding: 0 16px; }
  #takeView { position: fixed; inset: 0; z-index: 60; background: #0a0a0b; display: none;
    flex-direction: column; padding: 24px 20px; font-family: Arial, sans-serif; }
  #takeView.open { display: flex; }
  #takeView h2 { color: var(--gold); font-size: 18px; margin-bottom: 12px; }
  #takeVideo { flex: 1; width: 100%; min-height: 0; background: #000; border-radius: 10px; }
  #takeView .row { display: flex; gap: 8px; margin-top: 12px; }
  #takeView a, #takeView button { border-radius: 8px; padding: 12px 20px; font-size: 16px; min-height: 48px;
    cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
  #dlBtn { background: var(--gold); color: #000; font-weight: 700; }
  #discardBtn { background: #1c1c1f; color: var(--ink); border: 1px solid #3a3a3e; }
</style>
</head>
<body>

<div id="topwrap">
<div id="banner"><div class="b1">RTJ PROMPTER</div><div class="b2">RADIO &#8226; TELEVISION &#8226; JOURNALISM</div><div class="b3">NSCC IVANY CAMPUS &#8226; DARTMOUTH</div></div>
</div>

<div id="stage">
  <video id="cam" autoplay playsinline muted></video>
  <div id="scroller"><div id="text"></div></div>
  <div id="marker"><div class="line"></div><div class="grab" title="Drag to move the reading line"></div></div>
<div class="floating-dock dock-left">
  <button class="rtj-btn" data-act="play">▶ Play</button>
  <button class="rtj-btn" data-act="top">↑ Top</button>
  <button class="rtj-btn" data-act="mirror">⧉ Mirror</button>
</div>
<div class="floating-dock dock-right">
  <button class="rtj-btn btn-record" data-act="rec">⦿ Record</button>
  <button class="rtj-btn" data-act="edit">✎ Edit</button>
  <button class="rtj-btn" data-act="fs">⛶ Fullscreen</button>
</div>
</div>
<div id="recbar">
  <span id="recDot"></span>
  <button id="recPlayBtn" title="Roll or pause the words">▶ Words</button>
  <button id="recBtn">● Record</button>
  <span id="recTime">0:00</span>
  <button id="flipBtn" title="Front / back camera">⇄ Camera</button>
</div>
<div id="camMsg"></div>
<div id="takeView">
  <h2>Your take</h2>
  <video id="takeVideo" controls playsinline></video>
  <div class="row">
    <a id="dlBtn" href="#" download="rtj-take.webm">⬇ Save the video</a>
    <button id="discardBtn">Discard &amp; back</button>
  </div>
</div>
<div id="count"></div>
<div id="hint">Space = play / pause &nbsp;·&nbsp; ↑ ↓ = speed &nbsp;·&nbsp; ← → = nudge &nbsp;·&nbsp; controls live on the screen edges</div>

<div id="editView">
  <h2>Your script</h2>
  <div id="setupRow" style="display:flex; gap:26px; flex-wrap:wrap; margin:0 0 14px; font-family:Arial,sans-serif; font-size:14px; color:#bbb;">
    <label>Speed <input type="range" id="speed" min="10" max="300" value="90"><span class="val" id="speedVal">90</span></label>
    <label>Text size <input type="range" id="fsize" min="32" max="120" value="64"><span class="val" id="fsizeVal">64</span></label>
  </div>

  <textarea id="scriptBox"></textarea>
  <div class="row">
    <button id="saveScript">Save &amp; prompt</button>
    <button id="cancelEdit" class="ghost">Cancel</button>
  </div>
  <div id="libBlock">
    <h2>Saved scripts — tap Load to put one on the prompter</h2>
    <div class="libsave">
      <input id="libName" type="text" placeholder="Name this script — e.g. Curtis's dialogue">
      <button id="libSaveBtn">Save script</button>
    </div>
    <div id="libList"></div>
  </div>
</div>

<script>
const DEFAULT_SCRIPT = `Students at Ivany Campus are getting hands-on experience with the latest technology as part of their college training.

From digital media to professional production equipment, these resources help prepare graduates for the demands of today's workforce.

I'm Curtis Robitaille, WTV News, Dartmouth.`;

const textEl = document.getElementById('text');
const scroller = document.getElementById('scroller');
const topwrap = document.getElementById('topwrap');
const countEl = document.getElementById('count');
const speedIn = document.getElementById('speed');
const fsizeIn = document.getElementById('fsize');

let script = localStorage.getItem('prompterScript') || DEFAULT_SCRIPT;
let y = 0, playing = false, speed = +speedIn.value, lastT = null, raf = null;
let mirrored = false;

function render() { textEl.textContent = script.replace(/\s+$/, ''); }
function maxScroll() { return Math.max(0, scroller.offsetHeight - window.innerHeight); }
function apply() { scroller.style.transform = `translateY(${-y}px)`; }
function clampY() { y = Math.min(Math.max(0, y), maxScroll()); }

function tick(t) {
  if (!playing) return;
  if (lastT == null) lastT = t;
  const dt = (t - lastT) / 1000; lastT = t;
  y += speed * dt;
  if (y >= maxScroll()) { y = maxScroll(); pause(); }
  apply();
  raf = requestAnimationFrame(tick);
}
function setPlayUI(icon, label) { document.querySelectorAll('[data-act="play"]').forEach(b => b.textContent = icon + ' ' + label); }
function play() {
  if (playing) return;
  playing = true; setPlayUI('⏸', 'Pause'); lastT = null;
  raf = requestAnimationFrame(tick);
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => { topwrap.classList.add('fade'); document.body.classList.add('faded'); }, 2500);
}
function pause() {
  playing = false; setPlayUI('▶', 'Play');
  if (raf) cancelAnimationFrame(raf);
  clearTimeout(hideTimer);
  topwrap.classList.remove('fade');
  document.body.classList.remove('faded');
}
function countdownThenPlay() {
  if (playing) { pause(); return; }
  let n = 3; countEl.style.display = 'flex'; countEl.textContent = n;
  const iv = setInterval(() => {
    n--;
    if (n <= 0) { clearInterval(iv); countEl.style.display = 'none'; play(); }
    else countEl.textContent = n;
  }, 800);
}
function toTop() { pause(); y = 0; apply(); }

document.querySelectorAll('.floating-dock .rtj-btn').forEach(b => b.addEventListener('click', () => {
  const act = b.dataset.act;
  if (act === 'play') countdownThenPlay();
  else if (act === 'top') toTop();
  else if (act === 'mirror') { mirrored = !mirrored; textEl.classList.toggle('mirror', mirrored); document.querySelectorAll('[data-act="mirror"]').forEach(x => x.classList.toggle('on', mirrored)); }
  else if (act === 'edit') { pause(); scriptBox.value = script; renderLib(); editView.classList.add('open'); }
  else if (act === 'fs') { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); }
  else if (act === 'rec') toggleRecMode();
}));

/* edit view */
const editView = document.getElementById('editView');
const scriptBox = document.getElementById('scriptBox');
document.getElementById('cancelEdit').addEventListener('click', () => editView.classList.remove('open'));
document.getElementById('saveScript').addEventListener('click', () => {
  script = scriptBox.value; localStorage.setItem('prompterScript', script);
  render(); toTop(); editView.classList.remove('open');
});

/* ---------- script library ---------- */
const libList = document.getElementById('libList');
const libName = document.getElementById('libName');
function loadLib() { try { return JSON.parse(localStorage.getItem('prompterLibrary') || '{}'); } catch (e) { return {}; } }
function storeLib(lib) { localStorage.setItem('prompterLibrary', JSON.stringify(lib)); }
if (!localStorage.getItem('prompterLibrarySeeded')) {
  const seedLib = loadLib();
  if (!seedLib['Standup 1 — Ivany Campus']) seedLib['Standup 1 — Ivany Campus'] = DEFAULT_SCRIPT;
  if (!seedLib['Standup 2 — Construction']) seedLib['Standup 2 — Construction'] = 'Construction and development projects continue to change the way communities look and operate.\n\nNew facilities can provide improved spaces for students, employees, and visitors, while also creating challenges during the construction process.\n\nI\'m Curtis Robitaille, WTV News, Dartmouth.';
  if (!seedLib['Standup 3 — College Life']) seedLib['Standup 3 — College Life'] = 'College life extends well beyond the classroom, with students balancing academic responsibilities, extracurricular activities, and time with friends.\n\nCampus common areas provide opportunities for students to connect, collaborate, and take a break from their busy schedules.\n\nI\'m Curtis Robitaille, WTV News, Dartmouth.';
  storeLib(seedLib);
  localStorage.setItem('prompterLibrarySeeded', '1');
}
function renderLib() {
  const lib = loadLib();
  const names = Object.keys(lib);
  libList.innerHTML = '';
  if (!names.length) {
    const d = document.createElement('div'); d.className = 'libempty';
    d.textContent = 'No saved scripts yet. Write one above, give it a name, and save it.';
    libList.appendChild(d); return;
  }
  names.forEach(nm => {
    const row = document.createElement('div'); row.className = 'librow';
    const label = document.createElement('span'); label.className = 'nm'; label.textContent = nm;
    const load = document.createElement('button'); load.className = 'load'; load.textContent = 'Load';
    load.addEventListener('click', () => {
      script = loadLib()[nm]; localStorage.setItem('prompterScript', script);
      render(); toTop(); editView.classList.remove('open');
    });
    const del = document.createElement('button'); del.textContent = 'Delete';
    del.addEventListener('click', () => { const l = loadLib(); delete l[nm]; storeLib(l); renderLib(); });
    row.appendChild(label); row.appendChild(load); row.appendChild(del);
    libList.appendChild(row);
  });
}
document.getElementById('libSaveBtn').addEventListener('click', () => {
  const lib = loadLib();
  let nm = libName.value.trim();
  if (!nm) nm = 'Script ' + new Date().toLocaleString();
  lib[nm] = scriptBox.value;
  storeLib(lib); libName.value = ''; renderLib();
});

/* keyboard */
document.addEventListener('keydown', (e) => {
  if (editView.classList.contains('open')) return;
  if (e.code === 'Space') { e.preventDefault(); countdownThenPlay(); }
  else if (e.key === 'ArrowUp') { speed = Math.min(300, speed + 10); speedIn.value = speed; document.getElementById('speedVal').textContent = speed; }
  else if (e.key === 'ArrowDown') { speed = Math.max(10, speed - 10); speedIn.value = speed; document.getElementById('speedVal').textContent = speed; }
  else if (e.key === 'ArrowRight') { y += 60; clampY(); apply(); }
  else if (e.key === 'ArrowLeft') { y -= 60; clampY(); apply(); }
  else if (e.key === 'Home') { toTop(); }
});

/* wheel = manual scroll */
document.getElementById('stage').addEventListener('wheel', (e) => { pause(); y += e.deltaY; clampY(); apply(); }, { passive: true });

/* auto-hide control bar while prompting */
let hideTimer = null;
document.addEventListener('mousemove', (e) => {
  topwrap.classList.remove('fade');
  document.body.classList.remove('faded');
  const near = e.clientX < 110 || e.clientX > window.innerWidth - 110;
  document.querySelectorAll('.floating-dock').forEach(s => s.classList.toggle('near', near));
  clearTimeout(hideTimer);
  if (e.clientY > 240) hideTimer = setTimeout(() => { if (playing) { topwrap.classList.add('fade'); document.body.classList.add('faded'); } }, 2500);
});

window.addEventListener('resize', () => { applyMark(); clampY(); apply(); });

/* draggable reading line — drag the gold arrows up or down; the spot is remembered */
let markFrac = parseFloat(localStorage.getItem('prompterMarkFrac')) || 0.55;
function applyMark() { document.documentElement.style.setProperty('--mark', (markFrac * window.innerHeight) + 'px'); }
applyMark();
const grabEl = document.querySelector('#marker .grab');
let draggingLine = false;
grabEl.addEventListener('pointerdown', (e) => { draggingLine = true; grabEl.setPointerCapture(e.pointerId); e.preventDefault(); });
grabEl.addEventListener('pointermove', (e) => {
  if (!draggingLine) return;
  markFrac = Math.min(0.85, Math.max(0.15, e.clientY / window.innerHeight));
  applyMark(); clampY(); apply();
});
grabEl.addEventListener('pointerup', () => { draggingLine = false; localStorage.setItem('prompterMarkFrac', markFrac); });

/* ---------- record mode ---------- */
const cam = document.getElementById('cam');
const camMsg = document.getElementById('camMsg');
const recBtn = document.getElementById('recBtn');
const recDot = document.getElementById('recDot');
const recTime = document.getElementById('recTime');
const takeView = document.getElementById('takeView');
const takeVideo = document.getElementById('takeVideo');
const dlBtn = document.getElementById('dlBtn');
let stream = null, recorder = null, chunks = [], recStart = 0, recTimer = null;
let facing = 'user', recMode = false;

function fmtTime(ms) { const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }

async function startCam() {
  try {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing }, audio: true });
    cam.srcObject = stream;
    cam.classList.toggle('front', facing === 'user');
    camMsg.style.display = 'none';
    return true;
  } catch (e) {
    camMsg.textContent = 'The camera could not be opened here. Prompt mode still works — some browsers block camera recording.';
    camMsg.style.display = 'block';
    return false;
  }
}

async function toggleRecMode() {
  if (!recMode) {
    if (!navigator.mediaDevices || !window.MediaRecorder) {
      camMsg.textContent = 'This browser cannot record video. Prompt mode still works.';
      camMsg.style.display = 'block';
      return;
    }
    recMode = true;
    document.body.classList.add('recmode');
    document.querySelectorAll('[data-act="rec"]').forEach(b => { b.classList.add('on'); b.textContent = '⦿ Record: on'; });
    await startCam();
  } else {
    recMode = false;
    document.body.classList.remove('recmode');
    document.querySelectorAll('[data-act="rec"]').forEach(b => { b.classList.remove('on'); b.textContent = '⦿ Record'; });
    if (recorder && recorder.state === 'recording') stopRecording();
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    pause();
  }
}

document.getElementById('flipBtn').addEventListener('click', async () => {
  facing = (facing === 'user') ? 'environment' : 'user';
  if (recMode) await startCam();
});
document.getElementById('recPlayBtn').addEventListener('click', countdownThenPlay);

function pickMime() {
  const opts = ['video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
  for (const o of opts) { try { if (MediaRecorder.isTypeSupported(o)) return o; } catch (e) {} }
  return '';
}

function beginTake() {
  const mime = pickMime();
  chunks = [];
  recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  recorder.onstop = showTake;
  recorder.start(250);
  recStart = Date.now();
  recTime.textContent = '0:00';
  recTimer = setInterval(() => { recTime.textContent = fmtTime(Date.now() - recStart); }, 250);
  recBtn.textContent = '■ Stop'; recBtn.classList.add('recording'); recDot.style.display = 'block';
  toTop(); play();
}

function stopRecording() {
  if (recorder && recorder.state === 'recording') recorder.stop();
  clearInterval(recTimer);
  recBtn.textContent = '● Record'; recBtn.classList.remove('recording'); recDot.style.display = 'none';
  pause();
}

recBtn.addEventListener('click', async () => {
  if (recorder && recorder.state === 'recording') { stopRecording(); return; }
  if (!stream) { const ok = await startCam(); if (!ok) return; }
  if (playing) pause();
  let n = 3; countEl.style.display = 'flex'; countEl.textContent = n;
  const iv = setInterval(() => {
    n--;
    if (n <= 0) { clearInterval(iv); countEl.style.display = 'none'; beginTake(); }
    else countEl.textContent = n;
  }, 800);
});

function showTake() {
  const type = (recorder && recorder.mimeType) || 'video/webm';
  const blob = new Blob(chunks, { type: type });
  const url = URL.createObjectURL(blob);
  takeVideo.src = url;
  dlBtn.href = url;
  dlBtn.download = 'rtj-take.' + (type.indexOf('mp4') >= 0 ? 'mp4' : 'webm');
  takeView.classList.add('open');
}
document.getElementById('discardBtn').addEventListener('click', () => {
  takeView.classList.remove('open');
  takeVideo.removeAttribute('src'); takeVideo.load();
});

render(); apply();
</script>
